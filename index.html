<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- ── Primary SEO ─────────────────────────────────────────────── -->
    <title>Burger &amp; Bites — Order Burgers Online in Karachi | Burger and Bites</title>
    <meta
      name="description"
      content="Burger & Bites (burgerandbites) — fresh, delicious burgers, fast food and deals in Karachi. Browse the menu and order online in seconds via WhatsApp. Burger and Bites: quality bites, honest prices, fast delivery."
    />
    <meta
      name="keywords"
      content="burger, bites, burger & bites, burger and bites, burgerandbites, burgerandbites.com, burger n bites, bnb burgers, burgers karachi, burger delivery karachi, fast food karachi, order burger online, order food online karachi, best burger near me, burger deals karachi, zinger burger karachi, beef burger karachi"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Burger & Bites" />
    <link rel="canonical" href="https://burgerandbites.com/" />

    <!-- Local relevance -->
    <meta name="geo.region" content="PK-SD" />
    <meta name="geo.placename" content="Karachi" />

    <!-- ── Open Graph (WhatsApp/Facebook link previews) ────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Burger & Bites" />
    <meta property="og:title" content="Burger & Bites — Order Burgers Online in Karachi" />
    <meta
      property="og:description"
      content="Fresh, delicious burgers and fast food in Karachi. Browse the menu and order in seconds via WhatsApp."
    />
    <meta property="og:url" content="https://burgerandbites.com/" />
    <meta property="og:image" content="https://burgerandbites.com/og-image.png" />
    <meta property="og:locale" content="en_PK" />

    <!-- ── Twitter card ────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Burger & Bites — Order Burgers Online in Karachi" />
    <meta
      name="twitter:description"
      content="Fresh, delicious burgers and fast food in Karachi. Order online via WhatsApp."
    />
    <meta name="twitter:image" content="https://burgerandbites.com/og-image.png" />

    <!-- ── Structured data: tells Google this is a restaurant, and every
         name variation people might search for ─────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Burger & Bites",
      "alternateName": [
        "Burger and Bites",
        "BurgerAndBites",
        "burgerandbites",
        "burgerandbites.com",
        "Burger n Bites",
        "BnB Burgers"
      ],
      "url": "https://burgerandbites.com/",
      "image": "https://burgerandbites.com/og-image.png",
      "telephone": "+%VITE_WHATSAPP_NUMBER%",
      "servesCuisine": ["Burgers", "Fast Food"],
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Karachi",
        "addressRegion": "Sindh",
        "addressCountry": "PK"
      },
      "potentialAction": {
        "@type": "OrderAction",
        "target": "https://burgerandbites.com/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Burger &amp; Bites — fresh, delicious burgers and fast food in Karachi.
      Enable JavaScript to browse the menu and order online.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
